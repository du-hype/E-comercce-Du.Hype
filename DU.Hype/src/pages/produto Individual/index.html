<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto - DUHYPE</title>
  
  <link rel="stylesheet" href="/DU.Hype/src/assets/styles/styles.css"> 
  <link rel="stylesheet" href="style.css"> 
</head>
<body>

  <header class="main-header">
      <div class="header-container">
          <a href="/DU.Hype/index.html" class="logo">
              <img src="/DU.Hype/src/assets/Images/LogoDu.Hype.svg" alt="Logo DUHYPE">
          </a>
          <nav class="main-nav">
              <ul>
                  <li><a href="/DU.Hype/index.html">Início</a></li>
                  <li><a href="/DU.Hype/src/pages/marcas/index.html">Marcas</a></li>
                  <li><a href="/DU.Hype/src/pages/fedd/index.html">Feed</a></li>
                  <li><a href="/DU.Hype/src/pages/novidades/index.html">Novidades</a></li>
              </ul>
          </nav>
          <div class="header-icons">
              <a href="#" aria-label="Pesquisar"><img src="/DU.Hype/src/assets/Images/Search.svg" alt=""></a>
              <a href="/DU.Hype/src/pages/carrinho/index.html" aria-label="Carrinho"><img src="/DU.Hype/src/assets/Images/Cart.svg" alt=""></a>
              <a href="/DU.Hype/src/pages/cadastro/index.html" aria-label="Perfil do usuário"><img src="/DU.Hype/src/assets/Images/Account.svg" alt=""></a>
          </div>
      </div>
  </header>

  <main>
    <section class="produto">
      <div class="galeria">
        <div id="thumbs-container" class="thumbs">
          </div>
        <div class="imagem-principal">
          <img id="imagem-principal-produto" src="" alt="Tênis principal">
        </div>
      </div>

      <div class="detalhes">
        <p id="marca-produto" class="marca-produto-individual">MARCA</p> <h2 id="nome-produto">Nome do Produto</h2>
        <div class="avaliacao">★★★★☆ (45 avaliações)</div>
        <p id="preco-produto" class="preco">R$ 0,00</p>

        <div class="tamanhos">
          <button class="size">38</button>
          <button class="size ativo">40</button>
          <button class="size">41</button>
          <button class="size">42</button>
        </div>

        <a href="/DU.Hype/src/pages/carrinho/index.html"><button id="comprarBtn" class="comprar">COMPRAR</button></a>
      </div>
    </section>

    <section class="caracteristicas">
      <h3>Características</h3>
      <p id="descricao-produto">
        A descrição do produto será carregada aqui...
      </p>
    </section>

    </main>

  <footer>
    <p>© 2024 DUHYPE - Todos os direitos reservados</p>
  </footer>

  <script src="/DU.Hype/src/assets/js/produtos.js"></script>

  <script>
    // --- LÓGICA DINÂMICA PARA PREENCHER A PÁGINA ---
    window.addEventListener('load', function() {
        const params = new URLSearchParams(window.location.search);
        const produtoId = params.get('id');
        
        // Verifica se a lista de produtos existe antes de continuar
        if (typeof produtos === 'undefined') {
            console.error("Erro: O arquivo produtos.js não foi encontrado ou está com erro.");
            document.querySelector('main').innerHTML = '<h1 style="text-align:center; padding: 50px;">Erro ao carregar dados dos produtos.</h1>';
            return;
        }

        const produto = produtos.find(p => p.id == produtoId);

        if (produto) {
            // Pega os elementos do HTML pelos IDs que adicionamos
            const imagemPrincipalEl = document.getElementById('imagem-principal-produto');
            const thumbsContainerEl = document.getElementById('thumbs-container');
            const marcaEl = document.getElementById('marca-produto');
            const nomeEl = document.getElementById('nome-produto');
            const precoEl = document.getElementById('preco-produto');
            const descricaoEl = document.getElementById('descricao-produto');

            // Preenche os elementos com os dados do produto
            document.title = produto.nome + " - DUHYPE";
            imagemPrincipalEl.src = produto.imagem_principal;
            imagemPrincipalEl.alt = produto.nome;
            marcaEl.textContent = produto.marca;
            nomeEl.textContent = produto.nome;
            precoEl.textContent = produto.preco;
            descricaoEl.textContent = produto.descricao;

            // Limpa e cria as fotos pequenas (thumbnails)
            thumbsContainerEl.innerHTML = '';
            produto.imagens_thumb.forEach(thumbSrc => {
                const img = document.createElement('img');
                img.src = thumbSrc;
                img.addEventListener('click', function() {
                    imagemPrincipalEl.src = thumbSrc;
                });
                thumbsContainerEl.appendChild(img);
            });

        } else {
            document.querySelector('main').innerHTML = '<h1 style="text-align:center; padding: 50px;">Produto não encontrado!</h1>';
        }
    });

    // --- SCRIPT ANTIGO PARA SELEÇÃO DE TAMANHO ---
    const sizeButtons = document.querySelectorAll(".size");
    sizeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        sizeButtons.forEach(b => b.classList.remove("ativo"));
        btn.classList.add("ativo");
      });
    });
  </script>
</body>
</html>
