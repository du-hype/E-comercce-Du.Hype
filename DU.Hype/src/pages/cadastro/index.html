<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login DU.HYPE</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="header-container">
        <header class="header">
            <div class="logo">
                <img src="/DU.Hype/src/assets/Images/LogoDu.Hype.svg" alt="Logo duhype">
            </div>
            <nav class="nav">
                <a href="/DU.Hype/index.html">Início</a>
                <a href="/DU.Hype/src/pages/marcas/index.html">Marcas</a>
                <a href="/DU.Hype/src/pages/fedd/index.html">Feed</a>
                <a href="/DU.Hype/src/pages/novidades/index.html">Novidades</a>
            </nav>
            <div class="icons">
                <a href="/DU.Hype/src/pages/fedd/index.html"><i class="fas fa-search"></i></a>
                <a href="/DU.Hype/src/pages/carrinho/index.html"><i class="fas fa-shopping-cart"></i></a>
                <a href="/DU.Hype/src/pages/cadastro/index.html"><i class="fas fa-user"></i></a>
            </div>
        </header>
    </div>
    
    <main class="main-content">
        <section class="form-section">
            <div class="login-container">
                <form class="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Digite seu email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Digite sua senha">
                    </div>
                </form>
                
                <div class="or-separator">
                    <span>ou</span>
                </div>
                
                <div class="social-login">
                    <a href="https://accounts.google.com" target="_blank" rel="noopener noreferrer">
                        <button class="social-btn google">
                            <i class="fab fa-google"></i> Registre-se com Google
                        </button>
                    </a>
                    <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                        <button class="social-btn facebook">
                            <i class="fab fa-facebook-f"></i> Registre-se com Facebook
                        </button>
                    </a>
                    <a href="https://account.apple.com" target="_blank" rel="noopener noreferrer">
                        <button class="social-btn apple">
                            <i class="fab fa-apple"></i> Registre-se com Apple
                        </button>
                    </a>
                </div>
                
                <div class="signup-link">
                    Já tem conta? <a href="/DU.Hype/src/pages/login/index.html">Fazer Login</a>
                </div>
            </div>
        </section>

        <section class="image-section">
            </section>
    </main>

</body>
</html>
